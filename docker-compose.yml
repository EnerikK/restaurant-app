services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-app-db
    environment:
      POSTGRES_DB: restaurant_app
      POSTGRES_USER: restaurant_app
      POSTGRES_PASSWORD: restaurant_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restaurant_app -d restaurant_app']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
    container_name: restaurant-app-backend
    environment:
      DJANGO_ENV: local
      SECRET_KEY: dev-insecure-key-change-me
      DEBUG: 'True'
      ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      DB_NAME: restaurant_app
      DB_USER: restaurant_app
      DB_PASSWORD: restaurant_app
      DB_HOST: db
      DB_PORT: 5432
    working_dir: /app
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed_restaurant_site &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: restaurant-app-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:
  frontend_node_modules:
